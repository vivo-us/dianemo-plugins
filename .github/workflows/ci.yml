name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Build first: every plugin imports @dianemo/plugin-kit, whose `types`
      # field points into its dist, so `check` cannot resolve it on a fresh
      # checkout until the kit has been built.
      - name: Build
        run: npm run build

      - name: Verify
        run: |
          npm run sort-imports:check
          npm run format
          npm run lint
          npm run check
          npm test

  # Every package is published independently, so its own version is the only
  # signal to a consumer that its code moved. The registry rejects a republish
  # of an unchanged version, but not until publish time — long after review.
  # Nothing else in this repo notices, because src/ and package.json can change
  # while every test, build and pack still passes.
  versions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the merge base with the target branch is reachable.
      # Comparing against the base tip instead would demand bumps for every
      # commit that landed on master after this branch started.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # No `npm ci`: the script reads package.json files and shells out to git,
      # so it needs nothing installed.
      - name: Check version bumps
        run: node scripts/check-version-bumps.mjs --base=${{ github.event.pull_request.base.sha }}

  # The suite above loads each plugin from packages/<name>/src, which never
  # consults package.json — so the exports map, the files list and the emitted
  # dist go unexercised. Consumers use nothing else. This packs the workspaces
  # and drives the tarballs by bare specifier against @dianemo/core from npm.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify packed packages
        run: npm run verify:pack

      # Setup examples are documentation that claims to compile, so it has to.
      - name: Verify README examples
        run: npm run verify:readme
